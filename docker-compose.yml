services:
  reactmap:
    # Built from this repo's Dockerfile instead of the upstream image, so the
    # *.custom.jsx overrides and the pt-br locale are baked in at build time.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reactmap
    # The Dockerfile defines no CMD, so the start command lives here.
    command: sh -c "yarn start"
    restart: unless-stopped
    volumes:
      - /home/pokelx/reactmap/production/server/.cache:/home/node/server/.cache
      - /home/pokelx/reactmap/production/server/src/configs:/home/node/server/src/configs
      # Optional - favicon.ico is gitignored, so it still comes from the host.
      - /home/pokelx/reactmap/production/public/favicon/favicon.ico:/home/node/public/favicon/favicon.ico

    security_opt:
      # https://nodramadevops.com/2019/06/running-docker-application-containers-more-securely/
      - no-new-privileges:true

    ports:
      - '127.0.0.1:9556:9556'

  reactmap-develop:
    image: ghcr.io/watwowmap/reactmap:develop
    container_name: reactmap-develop
    command: sh -c "yarn start"
    restart: unless-stopped

    volumes:
      - /home/pokelx/reactmap/development/server/.cache:/home/node/server/.cache
      - /home/pokelx/reactmap/development/server/src/configs:/home/node/server/src/configs

    security_opt:
      # https://nodramadevops.com/2019/06/running-docker-application-containers-more-securely/
      - no-new-privileges:true

    ports:
      - '127.0.0.1:9557:9557'